<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101c1b" />
    <title>归云录 · 江岸危局</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%236dc8ae'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%23101c1b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="归云录 3D 武侠游戏">
      <canvas id="game-canvas" tabindex="0" aria-label="3D 游戏画面"></canvas>

      <section id="hud" class="hud" aria-live="polite">
        <div class="hud__brand">归云录</div>
        <div class="hud__objective">
          <span class="hud__eyebrow">当前目标</span>
          <strong id="objective-text">在山门前整备</strong>
        </div>
        <div class="hud__hint" id="control-hint">WASD 移动 · 拖动鼠标转动镜头 · 空格跳跃</div>
      </section>

      <section id="start-screen" class="start-screen">
        <div class="start-screen__mist"></div>
        <div class="start-card">
          <p class="start-card__kicker">原创 3D 武侠冒险</p>
          <h1>归云录</h1>
          <p class="start-card__chapter">江岸危局</p>
          <p class="start-card__intro">山门急信传来，江边村落正等待一支敢越断桥、闯入古寺的援军。</p>
          <div class="controls-grid" aria-label="操作说明">
            <span><kbd>WASD</kbd> 移动</span>
            <span><kbd>拖动</kbd> 镜头</span>
            <span><kbd>Space</kbd> 跳跃</span>
            <span><kbd>F</kbd> 全屏</span>
          </div>
          <button id="start-btn" type="button">踏入江湖</button>
          <p class="start-card__note">桌面与手机横屏均可游玩</p>
        </div>
      </section>

      <aside id="rotate-device" class="rotate-device" role="status">
        <div class="rotate-device__icon">↻</div>
        <strong>请横屏游玩</strong>
        <span>旋转设备以获得完整操作区域</span>
      </aside>
    </main>

    <script src="vendor/three.min.js"></script>
    <script src="src/core.js"></script>
  </body>
</html>
